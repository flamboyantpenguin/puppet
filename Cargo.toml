[package]
name = "puppet"
version = "0.1.0"
edition = "2024"
authors = ["Penguin <mail@flamboyantpenguin.in>"]
repository = "https://github.com/flamboyantpenguin/puppet"
description = "A broadcast logic system controller client for various tasks"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-humanize = "0.2.3"
dark-light = "2.0.0"
humantime = "2.4.0"
iced = { version = "0.14.0", features = ["image", "svg"] }
iced_gif = { version = "0.14.0", features = ["tokio"] }
iced_video_player = "0.6.0"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stream-download = "0.24.3"
tokio =  { version = "1.53.1", features = ["rt-multi-thread"] }
url = "2.5.8"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
