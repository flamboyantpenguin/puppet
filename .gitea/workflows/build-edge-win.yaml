---
name: Build Edge for Windows
"on":
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build-msvc:
    runs-on: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Setup gstreamer
        run: |
          $gstreamerDir = "C:\Users\Pot\gstreamer"
          $gstreamerBin = Join-Path $gstreamerDir "bin"
          $gstLaunch = Join-Path $gstreamerBin "gst-launch-1.0.exe"

          $requiredVersion = "1.28.6"
          $needsInstall = $true

          if (Test-Path $gstLaunch -PathType Leaf) {
              $versionOutput = & $gstLaunch --version 2>$null

              if ($LASTEXITCODE -eq 0 -and $versionOutput -match "GStreamer\s+$([regex]::Escape($requiredVersion))") {
                  $needsInstall = $false
                  Write-Host "GStreamer $requiredVersion already installed."
              }
          }

          if ($needsInstall) {
              Write-Host "GStreamer not found. Installing..."

              Invoke-WebRequest `
                  -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc/gstreamer-1.0-msvc-x86_64-1.28.6.exe" `
                  -OutFile "gst-setup.exe" `
                  -UseBasicParsing

              Start-Process .\gst-setup.exe `
                  -ArgumentList "/VERYSILENT /NORESTART /CURRENTUSER /TYPE=devel /DIR=$gstreamerDir" `
                  -Wait

              Remove-Item .\gst-setup.exe -Force
          }
          else {
              Write-Host "GStreamer already installed."
          }

          Add-Content -Path $env:GITEA_PATH -Value $gstreamerBin

      - name: Build
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Publish
        run: |
          curl.exe `
            --user "${{ gitea.repository_owner }}:${{ secrets.TOKEN }}" `
            -X DELETE `
            https://code.dawn.org.in/api/packages/${{ gitea.repository_owner }}/generic/puppet/edge/puppet-x86_64.exe

          curl.exe `
            --user "${{ gitea.repository_owner }}:${{ secrets.TOKEN }}" `
            --upload-file target/x86_64-pc-windows-msvc/release/puppet.exe `
            https://code.dawn.org.in/api/packages/${{ gitea.repository_owner }}/generic/puppet/edge/puppet-x86_64.exe
